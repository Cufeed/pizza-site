services:
  db:
    image: postgres:17-alpine
    container_name: pizza_db
    environment:
      POSTGRES_DB: pizza
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./PizzaWebApp
      dockerfile: Dockerfile
    container_name: pizza_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PizzaConnection: Host=db;Port=5432;Database=pizza;Username=postgres;Password=123
      Jwt__Key: supersecretkey_that_has_at_least_32_chars
      Jwt__Issuer: PizzaWebApp
      Jwt__Audience: PizzaWebAppUsers
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./pizza-app-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: pizza_web
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  db_data:


